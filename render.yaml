services:
  - type: web
    name: insightx-analytics-web
    runtime: static
    rootDir: frontend
    buildCommand: npm run assets:download && npm ci --no-audit --no-fund && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: insightx-analytics-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free
